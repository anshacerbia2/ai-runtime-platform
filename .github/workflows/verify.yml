name: Verify M0 M1 and BFF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      broker-db:
        image: postgres:17
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: disposable_pact_only
          POSTGRES_DB: pact
        options: >-
          --health-cmd "pg_isready -U pact -d pact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pact-broker:
        image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
        env:
          PACT_BROKER_DATABASE_URL: postgresql://pact:disposable_pact_only@broker-db:5432/pact
          PACT_BROKER_LOG_LEVEL: WARN
        ports:
          - 9292:9292
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runtime_m0
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ai_runtime_m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_m0 -d ai_runtime_m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      PACT_DO_NOT_TRACK: '1'
      M0_RUNTIME_MODE: m0-local
      M0_API_HOST: 127.0.0.1
      M0_API_PORT: '4311'
      M0_WEB_HOST: 127.0.0.1
      M0_WEB_PORT: '4310'
      M0_ALLOWED_HOSTS: 127.0.0.1,localhost
      M0_ALLOWED_ORIGINS: http://127.0.0.1:4310,http://localhost:4310,http://127.0.0.1:4311
      M0_API_BODY_LIMIT_BYTES: '65536'
      M0_API_REQUEST_TIMEOUT_MS: '15000'
      M0_DB_HOST: 127.0.0.1
      M0_DB_PORT: '5432'
      M0_DB_NAME: ai_runtime_m0
      M0_DB_USER: runtime_m0
      M0_DB_PASSWORD: disposable_ci_only
      M0_MANAGE_POSTGRES: 'false'
      PG_BIN: UNUSED
      M0_POSTGRES_DATA_DIR: .local/postgres-ci
      M0_POSTGRES_LOG_FILE: .local/postgres-ci.log
      M0_DB_POOL_MAX: '6'
      M0_DB_CONNECTION_TIMEOUT_MS: '3000'
      M0_DB_IDLE_TIMEOUT_MS: '10000'
      M0_DB_STATEMENT_TIMEOUT_MS: '5000'
      M0_DB_APPLICATION_NAME: ai-runtime-m0-prisma-ci
      M0_SEED_TX_MAX_WAIT_MS: '5000'
      M0_SEED_TX_TIMEOUT_MS: '15000'
      M0_DEV_API_READY_TIMEOUT_MS: '15000'
      M0_DEV_API_PROBE_TIMEOUT_MS: '1000'
      M0_DEV_API_POLL_INTERVAL_MS: '150'
      M0_DEV_CHILD_STOP_TIMEOUT_MS: '5000'
      M0_POSTGRES_START_TIMEOUT_SECONDS: '30'
      M0_APP_ID: m0-playground
      M0_APP_NAME: Local Contract Playground
      M0_APP_TOKEN: ci_playground_token_00000000000000000000000000000000
      M0_TEST_APP_ID: m0-test-other
      M0_TEST_APP_NAME: Isolation Test App
      M0_TEST_APP_TOKEN: ci_isolation_token_00000000000000000000000000000000
      M1_LOCAL_OPERATOR_TOKEN: ci_operator_fixture_00000000000000000000000000000000
      M1_LOCAL_RUNNER_TOKEN: ci_runner_fixture_00000000000000000000000000000000
      BFF_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      BFF_TEST_TIMEOUT_MS: '5000'
      WEB_DOCS_ROOT: docs
      WEB_RESPONSE_LIMIT_BYTES: '2097152'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSER_NAME: chromium
      PLAYWRIGHT_CHANNEL: none
      PLAYWRIGHT_TEST_TIMEOUT_MS: '30000'
      PLAYWRIGHT_WEB_SERVER_TIMEOUT_MS: '90000'
      PLAYWRIGHT_VIEWPORT_WIDTH: '1440'
      PLAYWRIGHT_VIEWPORT_HEIGHT: '1100'
      PLAYWRIGHT_REUSE_EXISTING_SERVER: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run verify
      - run: npm run test:gateway:redis
        env:
          M2_REPLAY_REDIS_URL: redis://127.0.0.1:6379/14
      - run: npm run test:runner:redis
        env:
          M3_COORDINATION_REDIS_URL: redis://127.0.0.1:6379/13
      - name: Start pinned MinIO dispatch conformance service
        run: |
          MINIO_BINARY="$RUNNER_TEMP/minio.RELEASE.2025-09-07T16-13-09Z"
          curl --fail --location --silent --show-error \
            --output "$MINIO_BINARY" \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $MINIO_BINARY" \
            | sha256sum --check -
          chmod +x "$MINIO_BINARY"
          mkdir -p "$RUNNER_TEMP/dispatch-minio-data"
          MINIO_ROOT_USER=minio_ci_access \
          MINIO_ROOT_PASSWORD=minio_ci_secret_0000000000000000 \
            "$MINIO_BINARY" server "$RUNNER_TEMP/dispatch-minio-data" \
              --address :9000 >"$RUNNER_TEMP/dispatch-minio.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/dispatch-minio.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dispatch-minio.log"
          exit 1
      - run: npm run test:dispatch:s3
        env:
          M3_TEST_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
          M3_TEST_OBJECT_STORE_ACCESS_KEY_ID: minio_ci_access
          M3_TEST_OBJECT_STORE_SECRET_ACCESS_KEY: minio_ci_secret_0000000000000000
      - run: npm run test:plugin:s3
        env:
          M3_TEST_OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
          M3_TEST_OBJECT_STORE_ACCESS_KEY_ID: minio_ci_access
          M3_TEST_OBJECT_STORE_SECRET_ACCESS_KEY: minio_ci_secret_0000000000000000
      - name: Stop isolated MinIO dispatch conformance service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dispatch-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/dispatch-minio.pid")" || true
          fi
      - run: npm run cdc:broker-proof
        env:
          PACT_BROKER_BASE_URL: http://127.0.0.1:9292
          PACT_VERSION: ${{ github.sha }}
          PACT_BRANCH: contract-ci
          PACT_ENVIRONMENT: contract-ci
          PACT_TIMEOUT_MS: '60000'
      - run: npm run test:web:redis
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
